<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Level Up Gamer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="contenedor-login">
        <div class="logo">Level Up Gamer</div>
        <h2>Inicio de Sesión</h2>
        <form id="formLogin">
            
            <div class="grupo-form">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" maxlength="100" placeholder="usuario@duoc.cl">
                <span id="errorCorreo" class="error">Solo se permiten correos @duoc.cl, @profesor.duoc.cl o @gmail.com.</span>
            </div>

            <div class="grupo-form">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" placeholder="Tu contraseña">
                <span id="errorContrasena" class="error">La contraseña debe tener entre 4 y 10 caracteres.</span>
            </div>

            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>
    <script src="js/carrito.js"></script>
    <script>
        // Lógica de Validación solicitada en la pauta para el Login
        document.getElementById('formLogin').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita que la página se recargue inmediatamente
            let esValido = true;

            // 1. Validar Correo
            const correo = document.getElementById('correo').value.trim();
            const dominiosValidos = ['@duoc.cl', '@profesor.duoc.cl', '@gmail.com'];
            const correoValido = dominiosValidos.some(dominio => correo.endsWith(dominio));
            
            if (!correoValido || correo.length > 100 || correo === '') {
                document.getElementById('errorCorreo').style.display = 'block';
                esValido = false;
            } else {
                document.getElementById('errorCorreo').style.display = 'none';
            }

            // 2. Validar Contraseña (entre 4 y 10 caracteres)
            const contrasena = document.getElementById('contrasena').value.trim();
            if (contrasena.length < 4 || contrasena.length > 10) {
                document.getElementById('errorContrasena').style.display = 'block';
                esValido = false;
            } else {
                document.getElementById('errorContrasena').style.display = 'none';
            }

            // Si todo está correcto
            if (esValido) {
                alert('¡Inicio de sesión exitoso!');
                // Aquí en el futuro redirigirías al panel de Administrador o Cliente
                window.location.href = 'index.html'; // Lo enviamos al Home por ahora
            }
        });
    </script>
    
</body>
</html>
