<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Level Up Gamer</title>
    <link rel="stylesheet" href="css/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <nav>
        <div class="logo-nav">⚡ Level Up Gamer</div>
        <div class="menu-links">
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html">Registro</a>
            <a href="contacto.html">Contacto</a>
        </div>
        <a href="carrito.html" class="carrito-badge">🛒 Carrito: <span id="contador-carrito">0</span></a>
    </nav>
    <div class="form-box">
        <h2>Crear Cuenta</h2>
        <form id="formReg">
            <div class="grupo">
                <label>RUT (Sin puntos ni guion):</label>
                <input type="text" id="rut" placeholder="Ej: 19011022K" maxlength="9">
                <span id="errRut" class="error">El RUT debe tener entre 7 y 9 caracteres, sin puntos ni guion.</span>
            </div>

            <div class="grupo">
                <label>Correo Electrónico:</label>
                <input type="email" id="correo" maxlength="100">
                <span id="errCorreo" class="error">Correo inválido. Usa @duoc.cl, @profesor.duoc.cl o @gmail.com.</span>
            </div>

            <div class="grupo">
                <label>Región:</label>
                <select id="region">
                    <option value="">Seleccione una región...</option>
                    <option value="RM">Metropolitana</option>
                    <option value="V">Valparaíso</option>
                </select>
            </div>
            
            <button type="submit">Registrarme</button>
        </form>
    </div>
    <script src="js/carrito.js"></script>
    <script>
        document.getElementById('formReg').addEventListener('submit', function(e) {
            e.preventDefault();
            let valido = true;
            
            // Validación RUT
            const rut = document.getElementById('rut').value.trim();
            const regexRut = /^[0-9]+[0-9kK]{1}$/;
            if(rut.length < 7 || rut.length > 9 || !regexRut.test(rut)) {
                document.getElementById('errRut').style.display = 'block';
                valido = false;
            } else { 
                document.getElementById('errRut').style.display = 'none'; 
            }

            if(valido) { 
                alert('¡Usuario registrado con éxito!');
                window.location.href = 'index.html';
            }
        });
    </script>
    
</body>
</html>
