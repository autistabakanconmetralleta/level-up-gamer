<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Level Up Gamer</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        .form-box { background: white; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .grupo { margin-bottom: 15px; }
        input, select { width: 95%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 12px; display: none; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2 style="text-align: center;">Crear Cuenta</h2>
        <form id="formReg">
            <div class="grupo">
                <label>RUT (Sin puntos ni guion):</label>
                <input type="text" id="rut" placeholder="Ej: 19011022K" maxlength="9">
                <span id="errRut" class="error">El RUT debe tener entre 7 y 9 caracteres, sin puntos ni guion.</span>
            </div>

            <div class="grupo">
                <label>Correo Electrónico:</label>
                <input type="email" id="correo" maxlength="100">
                <span id="errCorreo" class="error">Correo inválido. Usa @duoc.cl, @profesor.duoc.cl o @gmail.com.</span>
            </div>

            <div class="grupo">
                <label>Región:</label>
                <select id="region">
                    <option value="">Seleccione una región...</option>
                    <option value="RM">Metropolitana</option>
                    <option value="V">Valparaíso</option>
                </select>
            </div>
            
            <button type="submit">Registrarme</button>
        </form>
    </div>

    <script>
        document.getElementById('formReg').addEventListener('submit', function(e) {
            e.preventDefault();
            let valido = true;
            
            // Validación RUT
            const rut = document.getElementById('rut').value.trim();
            const regexRut = /^[0-9]+[0-9kK]{1}$/;
            if(rut.length < 7 || rut.length > 9 || !regexRut.test(rut)) {
                document.getElementById('errRut').style.display = 'block';
                valido = false;
            } else { 
                document.getElementById('errRut').style.display = 'none'; 
            }

            if(valido) { 
                alert('¡Usuario registrado con éxito!');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
