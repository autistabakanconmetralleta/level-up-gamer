<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Level Up Gamer</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 20px; }
        .cabecera { display: flex; justify-content: space-between; align-items: center; background: #333; color: white; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; }
        .catalogo { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .tarjeta { background: white; padding: 15px; border-radius: 8px; width: 220px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .tarjeta img { width: 100%; height: 200px; background-color: #ddd; object-fit: cover; border-radius: 4px; }
        .precio { font-weight: bold; color: #28a745; font-size: 1.2em; }
        button { margin-top: 10px; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #contador-carrito { background: red; color: white; padding: 3px 8px; border-radius: 50%; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="cabecera">
        <h1>Level Up Gamer - Catálogo</h1>
        <div>
            <span>🛒 Carrito: <span id="contador-carrito">0</span></span>
        </div>
    </div>

    <!-- Aquí se inyectarán los productos automáticamente con JavaScript -->
    <main class="catalogo" id="contenedor-productos">
    </main>

    <script>
        // 1. Crear un arreglo de productos (Requisito de la pauta)
        const productos = [
            { id: 1, nombre: "Grand Theft Auto V", precio: 25000 },
            { id: 2, nombre: "Apex Legends (Pase Batalla)", precio: 10000 },
            { id: 3, nombre: "Cyberpunk 2077", precio: 35000 },
            { id: 4, nombre: "Elden Ring", precio: 45000 }
        ];

        const contenedor = document.getElementById('contenedor-productos');
        const contadorCarrito = document.getElementById('contador-carrito');

        // 2. Mostrar los productos del arreglo en el HTML
        function cargarProductos() {
            productos.forEach(producto => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta';
                tarjeta.innerHTML = `
                    <div style="width:100%; height:150px; background:#ccc; display:flex; align-items:center; justify-content:center; border-radius:4px; margin-bottom:10px;">
                        <span>Foto Juego</span>
                    </div>
                    <h3>${producto.nombre}</h3>
                    <p class="precio">$${producto.precio}</p>
                    <button onclick="agregarAlCarrito(${producto.id}, '${producto.nombre}', ${producto.precio})">Añadir al carrito</button>
                `;
                contenedor.appendChild(tarjeta);
            });
        }

        // 3. Guardar información del carrito en LOCALSTORAGE (Requisito de la pauta)
        function agregarAlCarrito(id, nombre, precio) {
            // Recuperar el carrito o crear uno nuevo si está vacío
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            
            // Agregar producto
            carrito.push({ id, nombre, precio });
            
            // Guardar de vuelta
            localStorage.setItem('carrito', JSON.stringify(carrito));
            
            actualizarContador();
            alert(`¡${nombre} añadido al carrito correctamente!`);
        }

        function actualizarContador() {
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            contadorCarrito.innerText = carrito.length;
        }

        // Ejecutar funciones al abrir la página
        cargarProductos();
        actualizarContador();
    </script>
</body>
</html>
