<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Level Up Gamer</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background: #0f172a; 
            color: #f8fafc; 
        }

        /* Barra superior tipo Navbar */
        .cabecera { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(10px);
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .cabecera h1 { font-size: 1.4em; color: #38bdf8; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .carrito-badge { background: #1e293b; padding: 8px 15px; border-radius: 20px; border: 1px solid #334155; font-weight: bold; }
        #contador-carrito { background: #ef4444; color: white; padding: 2px 7px; border-radius: 50%; font-size: 0.85em; }

        /* Contenedor del Catálogo */
        .catalogo-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .titulo-catalogo { font-size: 2em; margin-bottom: 30px; border-left: 4px solid #38bdf8; padding-left: 10px; }
        
        .catalogo { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; }
        
        /* Tarjetas estilo Gamer con Animación Hover */
        .tarjeta { 
            background: #1e293b; 
            border-radius: 12px; 
            width: 230px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tarjeta:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
        }

        .tarjeta img { 
            width: 100%; 
            height: 150px; 
            object-fit: cover; 
            border-bottom: 1px solid #334155;
        }

        .info-tarjeta { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .tarjeta h3 { font-size: 1.1em; margin: 0 0 10px 0; color: #fff; }
        .precio { font-weight: bold; color: #34d399; font-size: 1.2em; margin-bottom: 15px; }

        /* Botón Gamer Estilizado */
        button { 
            padding: 10px; 
            background: linear-gradient(45deg, #3b82f6, #8b5cf6); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            transition: all 0.2s ease;
        }
        button:hover { 
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .volver-home { display: block; text-align: center; margin: 40px 0; color: #94a3b8; text-decoration: none; font-weight: 600; }
        .volver-home:hover { color: #38bdf8; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="cabecera">
        <h1>⚡ Level Up Gamer</h1>
        <div class="carrito-badge">
            🛒 Carrito: <span id="contador-carrito">0</span>
        </div>
    </div>

    <div class="catalogo-container">
        <h2 class="titulo-catalogo">Catálogo de Juegos</h2>
        <main class="catalogo" id="contenedor-productos">
            <!-- Se inyecta dinámicamente con JavaScript -->
        </main>
        
        <a href="index.html" class="volver-home">← Volver al Inicio</a>
    </div>

    <script>
        // Arreglo de productos actualizado con imágenes reales de alta calidad
        const productos = [
            { 
                id: 1, 
                nombre: "Grand Theft Auto V", 
                precio: 25000, 
                imagen: "https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?w=500&auto=format&fit=crop&q=60" 
            },
            { 
                id: 2, 
                nombre: "Apex Legends (Pase)", 
                precio: 10000, 
                imagen: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&auto=format&fit=crop&q=60" 
            },
            { 
                id: 3, 
                nombre: "Cyberpunk 2077", 
                precio: 35000, 
                imagen: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&auto=format&fit=crop&q=60" 
            },
            { 
                id: 4, 
                nombre: "Elden Ring", 
                precio: 45000, 
                imagen: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=500&auto=format&fit=crop&q=60" 
            }
        ];

        const contenedor = document.getElementById('contenedor-productos');
        const contadorCarrito = document.getElementById('contador-carrito');

        function cargarProductos() {
            productos.forEach(producto => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta';
                tarjeta.innerHTML = `
                    <img src="${producto.imagen}" alt="${producto.nombre}">
                    <div class="info-tarjeta">
                        <div>
                            <h3>${producto.nombre}</h3>
                            <p class="precio">$${producto.precio.toLocaleString('es-CL')}</p>
                        </div>
                        <button onclick="agregarAlCarrito(${producto.id}, '${producto.nombre}', ${producto.precio})">Añadir al carrito</button>
                    </div>
                `;
                contenedor.appendChild(tarjeta);
            });
        }

        function agregarAlCarrito(id, nombre, precio) {
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            carrito.push({ id, nombre, precio });
            localStorage.setItem('carrito', JSON.stringify(carrito));
            actualizarContador();
            alert(`¡${nombre} añadido al carrito!`);
        }

        function actualizarContador() {
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            contadorCarrito.innerText = carrito.length;
        }

        cargarProductos();
        actualizarContador();
    </script>
</body>
</html>
