<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Level Up Gamer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <div class="logo-nav">⚡ Level Up Gamer</div>
        <div class="menu-links">
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html">Registro</a>
            <a href="contacto.html">Contacto</a>
        </div>
        <a href="carrito.html" class="carrito-badge">🛒 Carrito: <span id="contador-carrito">0</span></a>
    </nav>
    <div class="contenedor">
        <h2>Contacto</h2>
        <form id="formContacto">
            
            <div class="grupo-form">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" maxlength="100" placeholder="Ingresa tu nombre">
                <span id="errorNombre" class="error">El nombre es obligatorio (máx 100 caracteres).</span>
            </div>

            <div class="grupo-form">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" maxlength="100" placeholder="ejemplo@duoc.cl">
                <span id="errorCorreo" class="error">Solo se permiten correos @duoc.cl, @profesor.duoc.cl o @gmail.com.</span>
            </div>

            <div class="grupo-form">
                <label for="comentario">Comentario:</label>
                <textarea id="comentario" rows="4" maxlength="500" placeholder="Escribe tu mensaje aquí..."></textarea>
                <span id="errorComentario" class="error">El comentario es obligatorio (máx 500 caracteres).</span>
            </div>

            <button type="submit">Enviar Mensaje</button>
        </form>
    </div>
    <script src="js/carrito.js"></script>
    <script>
        // Lógica de Validación solicitada en la pauta
        document.getElementById('formContacto').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita que la página se recargue
            let esValido = true;

            // 1. Validar Nombre
            const nombre = document.getElementById('nombre').value.trim();
            if (nombre === '' || nombre.length > 100) {
                document.getElementById('errorNombre').style.display = 'block';
                esValido = false;
            } else {
                document.getElementById('errorNombre').style.display = 'none';
            }

            // 2. Validar Correo
            const correo = document.getElementById('correo').value.trim();
            const dominiosValidos = ['@duoc.cl', '@profesor.duoc.cl', '@gmail.com'];
            const correoValido = dominiosValidos.some(dominio => correo.endsWith(dominio));
            
            if (!correoValido || correo.length > 100) {
                document.getElementById('errorCorreo').style.display = 'block';
                esValido = false;
            } else {
                document.getElementById('errorCorreo').style.display = 'none';
            }

            // 3. Validar Comentario
            const comentario = document.getElementById('comentario').value.trim();
            if (comentario === '' || comentario.length > 500) {
                document.getElementById('errorComentario').style.display = 'block';
                esValido = false;
            } else {
                document.getElementById('errorComentario').style.display = 'none';
            }

            // Si todo está bien
            if (esValido) {
                alert('¡Mensaje enviado con éxito!');
                document.getElementById('formContacto').reset();
            }
        });
    </script>
    
</body>
</html>
